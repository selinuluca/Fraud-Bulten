<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud & Teknoloji Bülteni</title>
<meta name="description" content="Dünyadan ve Türkiye'den haftanın en önemli 10 fraud, siber güvenlik ve yapay zekâ haberi; her biri en fazla dört satırda.">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1c1b19; --muted: #6b6760; --line: #e3dfd6;
    --fraud: #b3261e; --siber: #1f5fa8; --ai: #2f7d4f; --accent: #1c1b19;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15151a; --card: #1e1e25; --ink: #ecebe6; --muted: #9a978f; --line: #2e2e38;
            --fraud: #ff8a80; --siber: #82b6f5; --ai: #7fd3a0; --accent: #ecebe6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 Georgia, "Iowan Old Style", "Times New Roman", serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
  header h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: 0.92rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
         margin: 28px 0 8px; padding: 14px 0; border-top: 2px solid var(--accent); border-bottom: 1px solid var(--line);
         font-family: system-ui, sans-serif; font-size: 0.9rem; }
  select, .chip { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
                  border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  ol { list-style: none; padding: 0; margin: 0; }
  li.item { display: grid; grid-template-columns: 44px 1fr; gap: 6px 14px; padding: 24px 0; border-bottom: 1px solid var(--line); }
  .num { font-size: 1.7rem; line-height: 1.1; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tags { font-family: system-ui, sans-serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .tags span + span::before { content: " · "; color: var(--muted); }
  .fraud { color: var(--fraud); } .siber { color: var(--siber); } .ai { color: var(--ai); }
  .region { color: var(--muted); }
  h2 { font-size: 1.22rem; line-height: 1.3; margin: 4px 0 8px; }
  .item p { margin: 0 0 10px; }
  .meta { font-family: system-ui, sans-serif; font-size: 0.85rem; color: var(--muted); }
  a { color: inherit; text-underline-offset: 3px; }
  .meta a { color: var(--ink); }
  footer { margin-top: 36px; font-family: system-ui, sans-serif; font-size: 0.82rem; color: var(--muted); }
  .read { display: inline-block; margin: 0 0 10px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px;
          font-family: system-ui, sans-serif; font-size: 0.78rem; color: var(--muted); }
  .stats { margin: 14px 0 0; font-family: system-ui, sans-serif; font-size: 0.85rem; color: var(--muted); }
  .meta a:visited { color: #7b3fa0; }
  li.item.done h2, li.item.done p { color: var(--muted); }
  li.item.done .num::after { content: "✓"; display: block; font-size: 1rem; color: var(--ai); }
  .mark { margin-left: 8px; font: inherit; font-size: 0.8rem; color: var(--muted); background: none; border: 1px solid var(--line);
          border-radius: 999px; padding: 1px 9px; cursor: pointer; }
  .mark[aria-pressed="true"] { color: var(--ai); border-color: var(--ai); }
  .empty { padding: 32px 0; color: var(--muted); font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fraud & Teknoloji Bülteni</h1>
  </header>

  <div class="bar">
    <label>Hafta: <select id="issue" aria-label="Hafta seç"></select></label>
    <div class="chips" id="chips" role="group" aria-label="Filtre">
      <button class="chip" data-f="all" aria-pressed="true">Tümü</button>
      <button class="chip" data-f="fraud" aria-pressed="false">Fraud</button>
      <button class="chip" data-f="siber" aria-pressed="false">Siber güvenlik</button>
      <button class="chip" data-f="ai" aria-pressed="false">AI / Teknoloji</button>
      <button class="chip" data-f="tr" aria-pressed="false">Türkiye</button>
      <button class="chip" data-f="unread" aria-pressed="false">Okunmamış</button>
    </div>
  </div>

  <p class="stats" id="stats"></p>
  <ol id="list"></ol>

  <footer>
    Her Pazartesi akşamı güncellenir. Özetler Claude tarafından kaynak haberler okunarak yazılır;
    ayrıntı ve doğrulama için kaynak bağlantısını kullanın.
  </footer>
</div>

<script>
// Okunma/tıklanma sayacı (GoatCounter). Boşsa sayaç kapalı.
// Açmak için: goatcounter.com'da hesap aç, kodunu buraya yaz (ör. "fraudbulten"),
// GoatCounter ayarlarında "Allow adding visitor counts on your website" seçeneğini aç.
const GOATCOUNTER = "";
const GC = GOATCOUNTER ? "https://" + GOATCOUNTER + ".goatcounter.com" : "";
if (GC) {
  const s = document.createElement("script");
  s.async = true; s.src = "//gc.zgo.at/count.js"; s.dataset.goatcounter = GC + "/count";
  document.head.append(s);
}
async function gcCount(path) {
  if (!GC) return null;
  try {
    const r = await fetch(GC + "/counter/" + encodeURIComponent(path) + ".json");
    if (!r.ok) return null;
    return (await r.json()).count;
  } catch { return null; }
}
function gcEvent(path, title) {
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title, event: true }); } catch {}
}
// Okundu bilgisi bu tarayıcıda saklanır (başka cihaza taşınmaz).
const READ_KEY = "fraudBultenOkunan";
let readSet = new Set();
try { readSet = new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); } catch {}
function setRead(url, on) {
  on ? readSet.add(url) : readSet.delete(url);
  try { localStorage.setItem(READ_KEY, JSON.stringify([...readSet])); } catch {}
}
const words = (t) => (t || "").trim().split(/\s+/).filter(Boolean).length;

const CAT = { fraud: "Fraud", siber: "Siber güvenlik", ai: "AI / Teknoloji" };
const REG = { tr: "Türkiye", dunya: "Dünya" };
const $ = (id) => document.getElementById(id);
let current = null, filter = "all";

function fmt(d) {
  const [y, m, g] = d.split("-").map(Number);
  return new Date(y, m - 1, g).toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
}

function render() {
  const list = $("list");
  list.textContent = "";
  const all = current.items;
  const sumMin = Math.max(1, Math.round(all.reduce((s, it) => s + words(it.title) + words(it.summary), 0) / 180));
  const stats = $("stats");
  const unread = all.filter((it) => !readSet.has(it.url)).length;
  stats.textContent = all.length + " haber · " + unread + " okunmamış · özetlerin tamamı yaklaşık " + sumMin + " dk";
  gcCount(location.pathname).then((c) => { if (c) stats.textContent += " · sayfa " + c + " kez görüntülendi"; });
  const items = current.items
    .map((it, i) => ({ ...it, n: i + 1 }))
    .filter((it) => filter === "all" || it.category === filter || it.region === filter || (filter === "unread" && !readSet.has(it.url)));
  if (!items.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = filter === "unread" ? "Bu haftanın bütün haberlerini okudun." : "Bu hafta bu filtreye uyan haber yok.";
    list.append(p);
    return;
  }
  for (const it of items) {
    const li = document.createElement("li"); li.className = "item" + (readSet.has(it.url) ? " done" : "");
    const num = document.createElement("div"); num.className = "num"; num.textContent = String(it.n).padStart(2, "0");
    const body = document.createElement("div");
    const tags = document.createElement("div"); tags.className = "tags";
    const c = document.createElement("span"); c.className = it.category; c.textContent = CAT[it.category] || it.category;
    const r = document.createElement("span"); r.className = "region"; r.textContent = REG[it.region] || it.region;
    tags.append(c, r);
    const h = document.createElement("h2"); h.textContent = it.title;
    const p = document.createElement("p"); p.textContent = it.summary;
    const extra = [];
    if (it.read_min || it.coverage) {
      const rd = document.createElement("div"); rd.className = "read";
      const parts = [];
      if (it.read_min) parts.push("⏱ Kaynak haber: " + it.read_min + " dk okuma");
      if (it.coverage) parts.push("📰 " + it.coverage + " farklı yayında yer aldı");
      rd.textContent = parts.join("  ·  ");
      extra.push(rd);
    }
    const ev = "tik/" + current.date + "/" + String(it.n).padStart(2, "0");
    const meta = document.createElement("div"); meta.className = "meta";
    const a = document.createElement("a"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = it.source;
    a.addEventListener("click", () => { gcEvent(ev, it.title); setRead(it.url, true); setTimeout(render, 300); });
    meta.append(fmt(it.date) + " · Kaynak: ", a);
    for (const m of it.more || []) {
      const b = document.createElement("a"); b.href = m.url; b.target = "_blank"; b.rel = "noopener"; b.textContent = m.source;
      b.addEventListener("click", () => gcEvent(ev, it.title));
      meta.append(", ", b);
    }
    const mk = document.createElement("button"); mk.className = "mark"; mk.type = "button";
    const isRead = readSet.has(it.url);
    mk.setAttribute("aria-pressed", isRead ? "true" : "false");
    mk.textContent = isRead ? "✓ Okundu" : "Okundu işaretle";
    mk.addEventListener("click", () => { setRead(it.url, !readSet.has(it.url)); render(); });
    meta.append(mk);
    gcCount(ev).then((c) => { if (c) meta.append(" · " + c + " tıklama"); });
    body.append(tags, h, p, ...extra, meta);
    li.append(num, body);
    list.append(li);
  }
}

async function loadIssue(file) {
  current = window.__ISSUES__ ? window.__ISSUES__[file] : await (await fetch("data/" + file)).json();
  render();
}

async function init() {
  try {
    const idx = window.__INDEX__ || await (await fetch("data/index.json")).json();
    const sel = $("issue");
    for (const is of idx.issues) {
      const o = document.createElement("option"); o.value = is.file; o.textContent = is.label; sel.append(o);
    }
    sel.addEventListener("change", () => loadIssue(sel.value));
    $("chips").addEventListener("click", (e) => {
      const b = e.target.closest(".chip"); if (!b) return;
      filter = b.dataset.f;
      for (const x of $("chips").children) x.setAttribute("aria-pressed", x === b ? "true" : "false");
      render();
    });
    await loadIssue(idx.issues[0].file);
  } catch (err) {
    $("list").innerHTML = '<p class="empty">Bülten yüklenemedi. Lütfen daha sonra tekrar deneyin.</p>';
  }
}
init();
</script>
</body>
</html>
